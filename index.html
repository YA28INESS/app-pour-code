<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>École de Programmation Interactive IA</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --sidebar-bg: #252538;
            --text-color: #cdd6f4;
            --accent-color: #89b4fa;
            --success-color: #a6e3a1;
            --danger-color: #f38ba8;
            --card-bg: #313244;
            --input-bg: #45475a;
            --ia-green: #23a950;
            --render-orange: #e67e22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }

        /* Barre latérale */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid #45475a;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-align: center;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-color);
            padding: 12px 15px;
            margin-bottom: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
        }

        /* Zone principale */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        .tab-content {
            display: none;
            height: 100%;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        .title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
        }

        .chapter-badge {
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
        }

        /* --- NOUVEAU DESIGN DE L'ONGLET COMPTE --- */
        .account-contour {
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 20px;
            max-width: 450px;
            text-align: center;
            margin-bottom: 30px;
            background-color: rgba(137, 180, 250, 0.05);
        }

        .account-contour .name-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .account-contour .status-text {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .status-connected-text { color: var(--success-color); }
        .status-disconnected-text { color: var(--danger-color); }

        .auth-trigger-layout {
            display: flex;
            gap: 20px;
            max-width: 450px;
            margin-bottom: 30px;
        }

        .btn-green-rect {
            flex: 1;
            background-color: var(--ia-green);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .btn-green-rect:hover {
            background-color: #1e9444;
        }

        /* Boîtes d'étapes d'authentification */
        .auth-flow-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            max-width: 450px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            display: none; /* Masqué par défaut */
            position: relative;
        }

        .flow-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }
