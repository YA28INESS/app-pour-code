<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>École de Programmation Interactive IA</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --sidebar-bg: #252538;
            --text-color: #cdd6f4;
            --accent-color: #89b4fa;
            --success-color: #a6e3a1;
            --danger-color: #f38ba8;
            --card-bg: #313244;
            --input-bg: #45475a;
            --ia-green: #23a950;
            --render-orange: #e67e22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }

        /* Barre latérale */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid #45475a;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-align: center;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-color);
            padding: 12px 15px;
            margin-bottom: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
        }

        /* Zone principale */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        .tab-content {
            display: none;
            height: 100%;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        .title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
        }

        /* Badge Chapitre */
        .chapter-badge {
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
        }

        /* --- Onglet COMPTE --- */
        .status-banner {
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.1rem;
        }
        .status-disconnected {
            background-color: rgba(243, 139, 168, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }
        .status-connected {
            background-color: rgba(166, 227, 161, 0.15);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .auth-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .auth-card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            flex: 1;
            min-width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .auth-card h3 {
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #585b70;
            background-color: var(--input-bg);
            color: white;
            font-size: 1rem;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-right: 40px;
        }
        .eye-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-color);
            user-select: none;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        /* --- Onglet APPRENDRE --- */
        .learn-intro-btn {
            background-color: var(--ia-green);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 40px auto;
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .lesson-box {
            display: none;
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 12px;
            max-width: 750px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .lesson-text {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Carré noir exemple */
        .code-example-box {
            background-color: #11111b;
            color: #fab387;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.05rem;
            margin-bottom: 12px;
            border: 1px solid #45475a;
            white-space: pre-wrap;
        }

        .render-btn {
            background-color: var(--render-orange);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* Zone d'affichage du rendu visuel */
        .render-output-zone {
            background-color: white;
            color: black;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            min-height: 60px;
            border: 2px dashed #cca;
            display: none;
        }

        /* Animation spécifique pour l'exemple JS/CSS */
        @keyframes slide {
            from { margin-left: 0%; }
            to { margin-left: 70%; }
        }
        .animated-box {
            width: 50px;
            height: 50px;
            background-color: #e74c3c;
            animation: slide 2s infinite alternate ease-in-out;
        }

        .lesson-footer-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .page-counter {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            background-color: rgba(137, 180, 250, 0.1);
            padding: 5px 12px;
            border-radius: 6px;
        }

        .lesson-nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
        }
        .lesson-nav-btn:disabled {
            background-color: #585b70;
            cursor: not-allowed;
            color: #a6adc8;
        }

        /* --- Onglet EXERCICE --- */
        .exercise-layout {
            display: flex;
            gap: 20px;
            flex: 1;
            height: calc(100% - 60px);
            position: relative;
        }

        /* Rectangle Vert IA à gauche */
        .ia-question-box {
            width: 300px;
            background-color: var(--ia-green);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ia-question-box h3 {
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 8px;
        }

        .ia-question-text {
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 500;
        }

        .editor-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        textarea.code-editor {
            width: 100%;
            flex: 1;
            background-color: #11111b;
            color: #a6e3a1;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            padding: 15px;
            border: 1px solid #45475a;
            border-radius: 8px;
            resize: none;
            margin-bottom: 75px;
        }

        /* Actions du bas */
        .exercise-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .mode-toggle-btn {
            background-color: var(--ia-green);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .right-control {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            max-width: 450px;
            width: 60%;
        }

        .feedback-box {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid var(--accent-color);
            display: none;
            width: 100%;
            font-size: 0.95rem;
        }

        /* Bouton suivant vert interne */
        .next-exercise-btn {
            background-color: var(--ia-green);
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            display: block;
        }

        .correction-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .correction-btn:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Mon App Code</h2>
        <button class="nav-btn active" onclick="switchTab('compte')">Compte</button>
        <button class="nav-btn" onclick="switchTab('apprendre')">Apprendre</button>
        <button class="nav-btn" onclick="switchTab('exercice')">Exercice</button>
    </div>

    <div class="main-content">

        <div id="compte" class="tab-content active">
            <h1>Gestion du Compte</h1>
            <div id="connectionBanner" class="status-banner status-disconnected">Compte non connecté</div>

            <div class="auth-container">
                <div class="auth-card">
                    <h3>Créer un compte</h3>
                    <form onsubmit="handleAuth(event, 'inscription')">
                        <div class="form-group">
                            <label>Sauvegarder progression sur :</label>
                            <select required>
                                <option value="google">Google</option>
                                <option value="email">E-mail</option>
                                <option value="telephone">Téléphone</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Nom :</label>
                            <input type="text" placeholder="Ton nom" required>
                        </div>
                        <div class="form-group">
                            <label>Mot de passe :</label>
                            <div class="password-wrapper">
                                <input type="password" id="regPassword" placeholder="••••••••" required>
                                <button type="button" class="eye-btn" onclick="togglePassword('regPassword', this)">👁️‍🗨️</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Vérification du mot de passe :</label>
                            <div class="password-wrapper">
                                <input type="password" id="regPasswordConfirm" placeholder="••••••••" required>
                                <button type="button" class="eye-btn" onclick="togglePassword('regPasswordConfirm', this)">👁️‍🗨️</button>
                            </div>
                        </div>
                        <button type="submit" class="submit-btn">S'inscrire</button>
                    </form>
                </div>

                <div class="auth-card">
                    <h3>Se connecter</h3>
                    <form onsubmit="handleAuth(event, 'connexion')">
                        <div class="form-group">
                            <label>Support :</label>
                            <select required>
                                <option value="google">Google</option>
                                <option value="email">E-mail</option>
                                <option value="telephone">Téléphone</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Nom :</label>
                            <input type="text" placeholder="Ton nom" required>
                        </div>
                        <div class="form-group">
                            <label>Mot de passe :</label>
                            <div class="password-wrapper">
                                <input type="password" id="loginPassword" placeholder="••••••••" required>
                                <button type="button" class="eye-btn" onclick="togglePassword('loginPassword', this)">👁️‍🗨️</button>
                            </div>
                        </div>
                        <button type="submit" class="submit-btn">Se connecter</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="apprendre" class="tab-content">
            <div class="title-area">
                <h1>Apprendre les bases</h1>
                <div id="chapterBadgeLearn" class="chapter-badge">Chapitre 1 : HTML</div>
            </div>
            
            <button id="startBtn" class="learn-intro-btn" onclick="startLearning()">Commencer l'exercice</button>

            <div id="lessonBox" class="lesson-box">
                <div id="lessonText" class="lesson-text"></div>
                
                <div id="codeExample" class="code-example-box"></div>
                
                <button class="render-btn" onclick="generateRender()">Générer le rendu</button>
                
                <div id="renderOutput" class="render-output-zone"></div>

                <div class="lesson-footer-layout">
                    <button id="prevBtn" class="lesson-nav-btn" onclick="changeLesson(-1)">Précédent</button>
                    <div id="pageCounter" class="page-counter">1</div>
                    <button id="nextBtn" class="lesson-nav-btn" onclick="changeLesson(1)">Suivant</button>
                </div>
            </div>
        </div>

        <div id="exercice" class="tab-content">
            <div class="title-area">
                <h1>Zone d'Exercice</h1>
                <div id="chapterBadgeExercise" class="chapter-badge">Chapitre 1 : HTML</div>
            </div>
            
            <div class="exercise-layout">
                <div id="iaQuestionBox" class="ia-question-box">
                    <h3>🤖 Exercice avec des questions</h3>
                    <div id="iaQuestionText" class="ia-question-text">Étape 1 : Crée un titre principal complet.</div>
                </div>

                <div class="editor-side">
                    <textarea id="codeEditor" class="code-editor" placeholder="Écris ton code ici..."></textarea>
                    
                    <div class="exercise-actions">
                        <button id="modeBtn" class="mode-toggle-btn" onclick="toggleExerciseMode()">Exercice libre</button>
                        
                        <div class="right-control">
                            <div id="feedbackBox" class="feedback-box"></div>
                            <button class="correction-btn" onclick="checkCode()">Corriger l'exercice</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- ETAT GLOBAL DU JEU / PARCOURS ---
        let currentChapter = 1; // 1 = HTML, 2 = CSS, 3 = JS
        let isFreeMode = false;

        function updateChapterBadges() {
            const names = ["", "Chapitre 1 : HTML", "Chapitre 2 : CSS", "Chapitre 3 : JavaScript"];
            document.getElementById('chapterBadgeLearn').innerText = names[currentChapter];
            document.getElementById('chapterBadgeExercise').innerText = names[currentChapter];
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // --- COMPTE ET ŒIL DE SÉCURITÉ ---
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerText = "👁️";
            } else {
                input.type = "password";
                btn.innerText = "👁️‍🗨️";
            }
        }

        function handleAuth(event, type) {
            event.preventDefault();
            const banner = document.getElementById('connectionBanner');
            if (type === 'inscription') {
                if(document.getElementById('regPassword').value !== document.getElementById('regPasswordConfirm').value) {
                    return alert("Les mots de passe ne concordent pas !");
                }
            }
            banner.innerText = "Compte connecté";
            banner.className = "status-banner status-connected";
            alert("Opération validée avec succès !");
        }

        // --- BASE DE DONNÉES APPRENDRE (Leçons + Exemples + Rendus) ---
        const learnDatabase = {
            1: [ // HTML
                { text: "Bienvenue dans le Chapitre HTML ! C'est le squelette de ton site. Utilisons la balise de grand titre <h1> pour écrire un mot important.", code: "<h1>Bienvenue</h1>", type: "html" },
                { text: "Super ! Maintenant, découvrons comment ajouter un paragraphe de texte normal grâce à la balise <p>.", code: "<p>Ceci est un paragraphe écrit par l'IA.</p>", type: "html" },
                { text: "On peut aussi créer des boutons cliquables avec la balise <button>.", code: "<button>Clique ici !</button>", type: "html" }
            ],
            2:
